<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de Clientes · Wiz Mídia</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#28313c;
    --txt:#e6edf3; --muted:#8b98a5; --accent:#16c79a;
    --alta:#ff5d5d; --media:#ffb020; --baixa:#38d39f;
    --low:#ff5d5d; --mid:#ffb020; --high:#2ecf87;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0e1116,#0e1116f2);border-bottom:1px solid var(--line);padding:14px 20px;backdrop-filter:blur(6px)}
  h1{margin:0;font-size:19px}h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .stat b{color:var(--txt);font-size:15px;margin-right:5px}
  .stat.on{border-color:var(--accent);color:var(--txt)}
  .stat .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  input.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:8px 12px;font-size:14px;outline:none}
  input.search:focus{border-color:var(--accent)}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#04120d;border-color:var(--accent);font-weight:600}
  main{padding:16px 20px 90px;max-width:1180px;margin:0 auto}
  .catgroup{margin-top:22px}
  .cathead{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
  .cathead::after{content:"";flex:1;height:1px;background:var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .card.alta{border-left:4px solid var(--alta)}
  .card.media{border-left:4px solid var(--media)}
  .card.baixa{border-left:4px solid var(--baixa)}
  .card.vazio{border-left:4px solid #3a4655}
  .crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cname{font-size:16px;font-weight:700}
  .tag{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
  .spacer{flex:1}
  select.prio,.prazo{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 8px;font-size:12.5px}
  .prazo{width:130px}
  /* satisfação */
  .sat{margin-top:13px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .sat-top{display:flex;align-items:center;gap:10px}
  .sat-lab{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .sat-pct{font-size:20px;font-weight:800;margin-left:auto}
  .satbar{height:10px;border-radius:6px;background:#0e141b;border:1px solid var(--line);overflow:hidden;margin-top:8px}
  .satfill{height:100%;border-radius:6px;transition:width .25s,background .25s}
  .sat input[type=range]{width:100%;margin-top:9px;accent-color:var(--accent)}
  .spark{margin-top:6px;height:34px;width:100%}
  .sat-foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:2px}
  /* timelines */
  .tls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}
  @media(max-width:820px){.tls{grid-template-columns:1fr}}
  .tl{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .tl h4{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .tl h4 .n{background:#0e141b;border:1px solid var(--line);border-radius:20px;padding:0 7px;font-size:11px;color:var(--txt)}
  .tl-item{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed #232c37;align-items:flex-start}
  .tl-item:last-child{border-bottom:0}
  .tl-chk{margin-top:3px;width:16px;height:16px;flex:0 0 auto;cursor:pointer;accent-color:var(--high)}
  .tl-tx{flex:1;font-size:13.5px;outline:none;white-space:pre-wrap}
  .tl-tx:focus{color:#fff}
  .tl-item.done .tl-tx{color:var(--muted);text-decoration:line-through}
  .tl-date{font-size:10.5px;color:var(--high);white-space:nowrap;margin-top:2px}
  .tl-del{color:#5a6673;cursor:pointer;font-size:14px;line-height:1;margin-top:2px}
  .tl-del:hover{color:var(--alta)}
  .tl-add{display:flex;gap:6px;margin-top:9px}
  .tl-add input{flex:1;background:#0e141b;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 9px;font-size:13px;outline:none}
  .tl-add input:focus{border-color:var(--accent)}
  .tl-add button{background:var(--accent);color:#04120d;border:0;border-radius:8px;padding:0 12px;font-weight:700;cursor:pointer}
  .tl-empty{font-size:12.5px;color:#556;padding:5px 0}
  /* diagnóstico completo */
  details.diag{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  details.diag summary{cursor:pointer;font-size:12px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-weight:700}
  .fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
  @media(max-width:860px){.fields{grid-template-columns:1fr}}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:4px}
  .field .val{background:#0e141b;border:1px solid var(--line);border-radius:10px;min-height:60px;padding:9px 11px;font-size:14px;color:var(--txt);outline:none;white-space:pre-wrap}
  .field .val:focus{border-color:var(--accent)}
  .field .val:empty:before{content:attr(data-ph);color:#556}
  footer{position:fixed;bottom:0;left:0;right:0;background:#0e1116f2;border-top:1px solid var(--line);padding:8px 20px;font-size:12px;color:var(--muted);display:flex;gap:14px;align-items:center;backdrop-filter:blur(6px)}
  .saved{color:var(--accent)}
</style>

<header>
  <h1>Diagnóstico de Clientes · <span>Wiz Mídia</span></h1>
  <div class="sub">Progresso por tarefas concluídas · a fazer · melhorias feitas. Tudo salva sozinho no servidor.</div>
  <div class="bar">
    <input class="search" id="q" placeholder="Buscar cliente…">
    <div class="stat" data-f="alta"><span class="dot" style="background:var(--alta)"></span><b id="c-alta">0</b>alta</div>
    <div class="stat" data-f="media"><span class="dot" style="background:var(--media)"></span><b id="c-media">0</b>média</div>
    <div class="stat" data-f="baixa"><span class="dot" style="background:var(--baixa)"></span><b id="c-baixa">0</b>baixa</div>
    <div class="stat"><b id="c-sat">0%</b>progresso médio</div>
    <button class="btn primary" id="pull">↻ Puxar</button>
    <button class="btn" id="print">Imprimir/PDF</button>
  </div>
</header>

<main id="app"></main>
<footer><span id="status" class="saved">Pronto.</span><span class="spacer" style="flex:1"></span><span id="count"></span></footer>

<script>
const CLIENTS = [
  {n:"Café Rivelini", cat:"Cafés & Ecommerce", obj:"Vendas"},
  {n:"Sydra Cafés", cat:"Cafés & Ecommerce", obj:"Vendas"},
  {n:"Primitivo", cat:"Cafés & Ecommerce", obj:"Vendas · Nuvemshop"},
  {n:"DBarbosa", cat:"Cafés & Ecommerce", obj:"Vendas · Nuvemshop"},
  {n:"Fratelli", cat:"Cafés & Ecommerce", obj:"Vendas · Tray"},
  {n:"Ki Pizza", cat:"Alimentação Local", obj:"Vendas"},
  {n:"Double Burguer", cat:"Alimentação Local", obj:"Engajamento e Vendas"},
  {n:"Inside English", cat:"Serviço · Saúde · Educação", obj:"Leads"},
  {n:"Odonto Center", cat:"Serviço · Saúde · Educação", obj:"Leads"},
  {n:"Fisio Mulher", cat:"Serviço · Saúde · Educação", obj:"Perfil"},
  {n:"Camila", cat:"Serviço · Saúde · Educação", obj:"Perfil/Tráfego"},
  {n:"Conceito Z", cat:"Serviço · Saúde · Educação", obj:"Perfil/Tráfego"},
  {n:"Ferreira Cell", cat:"Comércio Local", obj:"Perfil/Tráfego"},
  {n:"Mercadão das Baterias", cat:"Comércio Local", obj:"Leads"},
  {n:"Montanari Baterias", cat:"Comércio Local", obj:"Perfil/Tráfego"},
  {n:"Metalúrgica Dias", cat:"Comércio Local", obj:"—"},
  {n:"Grupo Semar", cat:"Comércio Local", obj:"Perfil/Tráfego"},
  {n:"Seiko Patrocínio", cat:"Comércio Local", obj:"Perfil/Tráfego"},
  {n:"Seiko Monte Carmelo", cat:"Comércio Local", obj:"Perfil/Tráfego"},
  {n:"Chamô", cat:"Marcas Próprias / Interno", obj:"App de serviços"},
  {n:"Wiz Mídia", cat:"Marcas Próprias / Interno", obj:"Agência"},
  {n:"rafaelsrn", cat:"Marcas Próprias / Interno", obj:"Pessoal"}
];
const CATS = ["Cafés & Ecommerce","Alimentação Local","Serviço · Saúde · Educação","Comércio Local","Marcas Próprias / Interno"];
const KEY = "wiz_diag_v2";
const API = "https://gwvabuxqufpqxdtqhmmy.supabase.co/functions/v1/diag";
const APIKEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3dmFidXhxdWZwcXhkdHFobW15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NjA1NzMsImV4cCI6MjA5NjQzNjU3M30.iLOTlJz4CcW0m-dMLQ2dY-RKZy32kxa5WhmOgxZ5Kas";
let store={}; try{ store=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ store={}; }
let filter=null;

function rec(name){
  const r = store[name] || (store[name]={});
  if(r.ctx===undefined)r.ctx=""; if(r.sit===undefined)r.sit=""; if(r.def===undefined)r.def="";
  if(r.acao===undefined)r.acao=""; if(r.prio===undefined)r.prio=""; if(r.prazo===undefined)r.prazo="";
  if(r.satisfacao===undefined)r.satisfacao=null;
  if(!Array.isArray(r.tarefas))r.tarefas=[];
  if(!Array.isArray(r.sat_hist))r.sat_hist=[];
  return r;
}
function prog(r){ const t=(r.tarefas||[]).length; if(!t)return 0; return Math.round(r.tarefas.filter(x=>x.feito).length/t*100); }
function recordProg(name){ const r=rec(name); const p=prog(r); const h=r.sat_hist; const lv=h.length?Number(h[h.length-1].valor):null; if(lv!==p){ if(h.length && String(h[h.length-1].data).slice(0,10)===today()) h[h.length-1]={valor:p,data:today()}; else h.push({valor:p,data:today()}); } r.satisfacao=p; }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function today(){return new Date().toISOString().slice(0,10);}
function fmtd(d){ if(!d)return""; const p=String(d).slice(0,10).split("-"); return p.length===3?(p[2]+"/"+p[1]):d; }
function satColor(v){ if(v==null)return"#3a4655"; if(v<40)return"var(--low)"; if(v<70)return"var(--mid)"; return"var(--high)"; }
function uid(p){ return p+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36); }

let ft; function flash(t){ const s=document.getElementById("status"); s.textContent=t; clearTimeout(ft); ft=setTimeout(()=>s.textContent="Pronto.",1400); }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
const pushTimers={};
function push(name){
  saveLocal(); flash("Salvo ✓");
  clearTimeout(pushTimers[name]);
  pushTimers[name]=setTimeout(async()=>{
    try{ const r=rec(name);
      await fetch(API,{method:"POST",headers:{apikey:APIKEY,Authorization:"Bearer "+APIKEY,"Content-Type":"application/json"},
        body:JSON.stringify({cliente:name,ctx:r.ctx,sit:r.sit,def:r.def,acao:r.acao,prio:r.prio,prazo:r.prazo,satisfacao:r.satisfacao,tarefas:r.tarefas,sat_hist:r.sat_hist,updated_by:"rafael"})});
    }catch(e){}
  },500);
}
async function loadServer(silent){
  try{
    if(!silent)flash("Carregando…");
    const res=await fetch(API,{headers:{apikey:APIKEY,Authorization:"Bearer "+APIKEY}});
    const j=await res.json();
    if(j&&j.ok&&j.data){
      Object.keys(j.data).forEach(name=>{ const s=j.data[name]; const r=rec(name);
        ["ctx","sit","def","acao","prio","prazo"].forEach(k=>{ if(s[k]!==undefined&&s[k]!=="")r[k]=s[k]; });
        if(s.satisfacao!==undefined)r.satisfacao=s.satisfacao;
        if(Array.isArray(s.tarefas))r.tarefas=s.tarefas;
        if(Array.isArray(s.sat_hist))r.sat_hist=s.sat_hist;
      });
      saveLocal(); render(); flash("Atualizado ✓");
    } else flash("Sem dados no servidor");
  }catch(e){ flash("Servidor offline (local)"); }
}

function sparkSVG(hist){
  const pts=(hist||[]).map(h=>Number(h.valor)).filter(v=>!isNaN(v));
  if(pts.length<2) return "";
  const W=100,H=34,pad=3; const max=100,min=0;
  const step=(W-pad*2)/(pts.length-1);
  const xy=pts.map((v,i)=>[pad+i*step, H-pad-((v-min)/(max-min))*(H-pad*2)]);
  const d=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=xy[xy.length-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="'+satColor(pts[pts.length-1])+'" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.5" fill="'+satColor(pts[pts.length-1])+'"/></svg>';
}

function taskRow(name,t,done){
  const el=document.createElement("div");
  el.className="tl-item"+(done?" done":"");
  el.innerHTML=
    '<input type="checkbox" class="tl-chk" '+(done?"checked":"")+'>'+
    '<div class="tl-tx" contenteditable>'+esc(t.texto)+'</div>'+
    (done?'<div class="tl-date">'+fmtd(t.feito_em||"")+'</div>':'')+
    '<div class="tl-del" title="Remover">×</div>';
  const r=rec(name);
  el.querySelector(".tl-chk").onchange=function(){
    t.feito=this.checked; t.feito_em=this.checked?today():null; recordProg(name); push(name); render();
  };
  el.querySelector(".tl-tx").onblur=function(){ t.texto=this.innerText.trim(); push(name); };
  el.querySelector(".tl-del").onclick=function(){
    r.tarefas=r.tarefas.filter(x=>x.id!==t.id); recordProg(name); push(name); render();
  };
  return el;
}

function cardEl(c){
  const r=rec(c.n);
  const cls=r.prio||"vazio";
  const el=document.createElement("div");
  el.className="card "+cls;
  const _tot=r.tarefas.length; const _dn=r.tarefas.filter(t=>t.feito).length; const p=_tot?Math.round(_dn/_tot*100):0;
  const pend=r.tarefas.filter(t=>!t.feito);
  const feitas=r.tarefas.filter(t=>t.feito).sort((a,b)=>String(b.feito_em||"").localeCompare(String(a.feito_em||"")));
  el.innerHTML=
    '<div class="crow">'+
      '<span class="cname">'+esc(c.n)+'</span>'+
      '<span class="tag">'+esc(c.obj)+'</span>'+
      '<span class="spacer"></span>'+
      '<select class="prio"><option value="">prioridade…</option><option value="alta">🔴 Alta</option><option value="media">🟡 Média</option><option value="baixa">🟢 Baixa</option></select>'+
      '<input class="prazo" placeholder="prazo (ex: 15/09)" value="'+esc(r.prazo||"")+'">'+
    '</div>'+
    '<div class="sat">'+
      '<div class="sat-top"><span class="sat-lab">Progresso</span><span class="sat-pct" style="color:'+satColor(p)+'">'+(_tot?p+"%":"—")+'</span></div>'+
      '<div class="satbar"><div class="satfill" style="width:'+p+'%;background:'+satColor(p)+'"></div></div>'+
      sparkSVG(r.sat_hist)+
      '<div class="sat-foot"><span>'+_dn+' de '+_tot+' tarefa(s)</span><span>evolução: '+(r.sat_hist.length)+' ponto(s)</span></div>'+
    '</div>'+
    '<div class="tls">'+
      '<div class="tl" data-tl="pend"><h4>⏳ A fazer <span class="n">'+pend.length+'</span></h4><div class="tl-list"></div>'+
        '<div class="tl-add"><input placeholder="nova tarefa…"><button>＋</button></div></div>'+
      '<div class="tl" data-tl="feito"><h4>✅ Melhorias feitas <span class="n">'+feitas.length+'</span></h4><div class="tl-list"></div></div>'+
    '</div>'+
    '<details class="diag"><summary>Diagnóstico completo (contexto · situação · gargalo)</summary>'+
      '<div class="fields">'+
        '<div class="field"><label>Contexto</label><div class="val" contenteditable data-k="ctx" data-ph="serviço, objetivo, metas…">'+esc(r.ctx||"")+'</div></div>'+
        '<div class="field"><label>Situação atual</label><div class="val" contenteditable data-k="sit" data-ph="como tá hoje…">'+esc(r.sit||"")+'</div></div>'+
        '<div class="field"><label>Deficiências / gargalos</label><div class="val" contenteditable data-k="def" data-ph="o que tá falhando…">'+esc(r.def||"")+'</div></div>'+
      '</div>'+
    '</details>';
  // prioridade / prazo
  const sel=el.querySelector(".prio"); sel.value=r.prio||"";
  sel.onchange=()=>{ r.prio=sel.value; push(c.n); render(); };
  const pz=el.querySelector(".prazo"); pz.onblur=()=>{ r.prazo=pz.value.trim(); push(c.n); };
  // listas de tarefas
  const pl=el.querySelector('[data-tl="pend"] .tl-list');
  if(pend.length) pend.forEach(t=>pl.appendChild(taskRow(c.n,t,false))); else pl.innerHTML='<div class="tl-empty">Nenhuma tarefa aberta.</div>';
  const fl=el.querySelector('[data-tl="feito"] .tl-list');
  if(feitas.length) feitas.forEach(t=>fl.appendChild(taskRow(c.n,t,true))); else fl.innerHTML='<div class="tl-empty">Nada concluído ainda.</div>';
  // adicionar tarefa
  const addWrap=el.querySelector('[data-tl="pend"] .tl-add');
  const addIn=addWrap.querySelector("input"); const addBt=addWrap.querySelector("button");
  const doAdd=()=>{ const v=addIn.value.trim(); if(!v)return; r.tarefas.push({id:uid("t"),texto:v,feito:false,prazo:"",feito_em:null}); addIn.value=""; recordProg(c.n); push(c.n); render(); };
  addBt.onclick=doAdd; addIn.onkeydown=(e)=>{ if(e.key==="Enter")doAdd(); };
  // diagnóstico completo
  el.querySelectorAll(".field .val").forEach(v=>{ v.onblur=()=>{ r[v.dataset.k]=v.innerText.trim(); push(c.n); }; });
  return el;
}

function render(){
  const app=document.getElementById("app");
  const q=(document.getElementById("q").value||"").toLowerCase();
  app.innerHTML=""; let shown=0;
  CATS.forEach(cat=>{
    const list=CLIENTS.filter(c=>c.cat===cat).filter(c=>{
      if(q && !c.n.toLowerCase().includes(q)) return false;
      const r=rec(c.n);
      if(filter==="vazio" && r.prio) return false;
      if(filter && filter!=="vazio" && r.prio!==filter) return false;
      return true;
    });
    if(!list.length) return;
    const g=document.createElement("div"); g.className="catgroup";
    g.innerHTML='<div class="cathead">'+cat+'</div>';
    list.forEach(c=>{ g.appendChild(cardEl(c)); shown++; });
    app.appendChild(g);
  });
  document.getElementById("count").textContent=shown+" de "+CLIENTS.length+" clientes";
  updStats();
}
function updStats(){
  let a=0,m=0,b=0,sv=[];
  CLIENTS.forEach(c=>{ const r=rec(c.n); if(r.prio==="alta")a++;else if(r.prio==="media")m++;else if(r.prio==="baixa")b++; if(r.tarefas.length)sv.push(prog(r)); });
  document.getElementById("c-alta").textContent=a;
  document.getElementById("c-media").textContent=m;
  document.getElementById("c-baixa").textContent=b;
  document.getElementById("c-sat").textContent=(sv.length?Math.round(sv.reduce((x,y)=>x+y,0)/sv.length):0)+"%";
}
document.querySelectorAll("header .stat[data-f]").forEach(s=>{ s.onclick=()=>{ const f=s.dataset.f; filter=(filter===f)?null:f; document.querySelectorAll(".stat[data-f]").forEach(x=>x.classList.toggle("on",x.dataset.f===filter)); render(); }; });
document.getElementById("q").oninput=render;
document.getElementById("print").onclick=()=>window.print();
document.getElementById("pull").onclick=()=>loadServer(false);
render(); loadServer(true);
</script>
