<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
  :root{ color-scheme: dark;
    --bg:#0f1420; --panel:#1b2231; --panel2:#151b28; --line:#2b3448;
    --txt:#e7edf5; --muted:#8b97ad; --accent:#3b82f6;
    --grad1:#19c6c0; --grad2:#3b82f6;
    --feed:#3b82f6; --reels:#8b74ff; --carrossel:#16c98d;
    --shadow:0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);font-size:14px;line-height:1.45;min-height:100vh;background:linear-gradient(165deg,#0f1420 0%,#0d1a1c 48%,#101226 100%);background-attachment:fixed}
  ::-webkit-scrollbar{height:10px;width:10px}
  ::-webkit-scrollbar-thumb{background:#39445c;border-radius:20px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#4a577330;background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  svg{display:block}
  .ic{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  /* ===== Login — identidade Wiz (preto + verde, Work Sans) ===== */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Work Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;background-image:radial-gradient(120% 80% at 50% -12%,rgba(65,222,56,.16),transparent 60%),radial-gradient(90% 60% at 50% 118%,rgba(59,167,53,.10),transparent 60%)}
  .login-card{position:relative;background:rgba(12,15,12,.72);border:1px solid rgba(65,222,56,.16);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);width:100%;max-width:400px;padding:40px 34px;backdrop-filter:blur(6px)}
  .login-brand{display:flex;align-items:center;justify-content:center;margin-bottom:24px}
  .login-brand b{font-weight:800;font-size:34px;letter-spacing:-1px;color:#fff;line-height:1;font-family:'Work Sans',sans-serif}
  .login-brand .dot{width:9px;height:9px;border-radius:50%;background:#41DE38;display:inline-block;margin:0 3px 4px 3px;box-shadow:0 0 14px rgba(65,222,56,.7)}
  .login-brand .mid{align-self:center;font-size:10px;font-weight:700;letter-spacing:3px;color:#7fe37a;text-transform:uppercase}
  .login-brand .login-logo-img{width:158px;height:auto;display:block;filter:drop-shadow(0 4px 14px rgba(65,222,56,.18))}
  .login-card h1{text-align:center;font-size:22px;font-weight:800;color:#fff;letter-spacing:-.3px;font-family:'Work Sans',sans-serif}
  .login-card h1 .g{color:#41DE38}
  .login-card .sub{text-align:center;color:#8fa08c;font-size:13px;margin:7px 0 26px}
  .login-card label{font-size:10.5px;color:#8fa08c;text-transform:uppercase;letter-spacing:.6px;font-weight:700;display:block;margin-bottom:7px}
  .login-card input{width:100%;background:#0e120e;border:1px solid #232a22;border-radius:11px;padding:13px 14px;font-size:15px;margin-bottom:16px;color:#eaf5e9;font-family:inherit;transition:border-color .15s,box-shadow .15s}
  .login-card input::placeholder{color:#5f6b5d}
  .login-card input:focus{outline:none;border-color:#41DE38;box-shadow:0 0 0 3px rgba(65,222,56,.16)}
  .login-card button.entrar{width:100%;background:#3BA735;color:#fff;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:15px;font-family:inherit;letter-spacing:.2px;transition:background .15s,transform .12s,box-shadow .15s;box-shadow:0 8px 22px rgba(59,167,53,.28)}
  .login-card button.entrar:hover{background:#41DE38;transform:translateY(-1px);box-shadow:0 12px 28px rgba(65,222,56,.36)}
  .login-card button.entrar:active{transform:translateY(0)}
  .login-card button.entrar:disabled{opacity:.6}
  .login-err{background:rgba(214,69,69,.12);color:#ff6b6b;border:1px solid rgba(214,69,69,.3);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;display:none}
  .login-foot{text-align:center;margin-top:20px;font-size:12px}
  .login-foot a{color:#7d8a7b;text-decoration:none}
  .login-foot a:hover{color:#41DE38}

  #app{display:none}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;white-space:nowrap}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--grad1),var(--grad2));display:flex;align-items:center;justify-content:center}
  .brand .logo svg{width:18px;height:18px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .who{flex:1;min-width:160px}
  .who .cname{font-weight:800;font-size:16px}
  .who .clabel{font-size:11px;color:var(--muted)}
  .month-nav{display:flex;align-items:center;gap:6px}
  .month-nav button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .month-nav button:hover{background:#232e42}
  .month-nav .ic{width:16px;height:16px;stroke-width:2.4}
  #monthLabel{font-weight:700;min-width:150px;text-align:center;text-transform:capitalize}
  .logout{background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 12px;font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px}
  .logout:hover{color:var(--reels);border-color:var(--reels)}
  .logout .ic{width:15px;height:15px}

  .tabs{display:flex;gap:2px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{background:none;border:none;color:var(--muted);padding:14px 18px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .tab:hover{color:var(--txt)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

  main{padding:24px;max-width:1440px;margin:0 auto}
  .view{display:none}
  .view.active{display:block;animation:viewIn .28s ease}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:9px}
  .card h2 .ic{width:17px;height:17px;color:var(--accent)}

  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card textarea{width:100%;min-height:120px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px;resize:vertical;font-size:14px;line-height:1.6}
  .full{grid-column:1/-1}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
  .stat .sic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .stat .sic .ic{width:21px;height:21px;color:#fff;stroke-width:2.2}
  .stat .n{font-size:26px;font-weight:800;line-height:1}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .goal{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .goal input[type=checkbox]{width:18px;height:18px;accent-color:var(--carrossel);flex-shrink:0}
  .goal input[type=text]{flex:1;background:none;border:none;color:var(--txt);font-size:14px;padding:5px}
  .goal input[type=text]:focus{outline:none;background:var(--panel2);border-radius:6px}
  .goal.done input[type=text]{text-decoration:line-through;color:var(--muted)}
  .goal .del{background:none;border:none;color:var(--muted);display:flex}
  .goal .del:hover{color:var(--reels)}
  .goal .del .ic{width:16px;height:16px}
  .add-btn{margin-top:12px;background:var(--panel2);border:1px dashed var(--line);color:var(--muted);padding:11px;border-radius:10px;width:100%;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
  .add-btn:hover{color:var(--accent);border-color:var(--accent)}
  .add-btn .ic{width:16px;height:16px}

  .cal-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
  .week-nav{display:flex;align-items:center;gap:8px}
  .week-nav button{background:var(--panel);border:1px solid var(--line);color:var(--txt);width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .week-nav button:hover{background:var(--panel2)}
  .week-nav .ic{width:16px;height:16px;stroke-width:2.4}
  #calLabel{font-weight:700;min-width:170px;text-align:center}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .chip-filter{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600}
  .chip-filter.active{color:#fff;border-color:transparent}
  .btn-primary{background:var(--accent);border:none;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-primary .ic{width:16px;height:16px;stroke:#fff}
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}

  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
  .thumb .tn{position:absolute;top:3px;left:3px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;width:18px;height:18px;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .thumb .tx{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:none;width:18px;height:18px;border-radius:6px;font-size:12px;line-height:1;cursor:pointer}
  .pub-warn{font-size:11.5px;color:#e0a94a;background:#2a2416;border:1px solid #4a3f1e;border-radius:9px;padding:9px 11px}
  .ai-btn{background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;border:none;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:800;cursor:pointer;letter-spacing:.2px}
  .ai-btn:hover{filter:brightness(1.08)}
  .ai-btn:disabled{opacity:.6;cursor:default}
  .lbl-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .kc-publishing{display:flex;align-items:center;gap:7px;background:#1b2a45;color:var(--accent);font-weight:800;font-size:11px;padding:6px 9px;border-radius:8px;margin-bottom:9px}
  .kc-publishing .spin{width:12px;height:12px;border:2px solid #b9d2ff;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .kcard.publishing{opacity:.9;cursor:default}
  .kc-cli{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;padding:2px 9px 2px 3px;border-radius:20px;background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;letter-spacing:.2px}
  .kc-cli .cli-av{width:16px;height:16px}
  .cli-picker{position:relative}
  .cli-current{width:100%;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-weight:700;color:var(--txt);cursor:pointer}
  .cli-current .chev{margin-left:auto;color:var(--muted);font-size:12px}
  .cli-av{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--accent);display:inline-block}
  .cli-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 30px rgba(20,40,80,.18);max-height:300px;overflow:auto;z-index:20;padding:5px}
  .cli-opt{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
  .cli-opt:hover{background:var(--panel2)}
  .cli-opt.sel{background:#232e42}
  .link-banner{background:linear-gradient(135deg,#16233a,#12261f);border:1px solid var(--line);border-radius:0;padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}
  .link-banner b{color:var(--txt)}
  .link-banner .lk{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-family:ui-monospace,monospace;font-size:12.5px;color:var(--accent);flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link-banner button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12px}
  .link-banner button:hover{filter:brightness(1.06)}
  .adm-back{background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 12px;font-weight:600;font-size:12px}
  .adm-back:hover{color:var(--accent);border-color:var(--accent)}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e2a3a;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:100}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  /* ===== POLISH ===== */
  header{background:linear-gradient(180deg,#1e2634,#171d29);backdrop-filter:saturate(1.1);border-bottom:1px solid var(--line)}
  .tab{transition:color .18s,border-color .18s}
  .tab .ic{transition:transform .18s}
  .tab:hover .ic{transform:translateY(-1px)}
  .tab.active{border-image:linear-gradient(90deg,var(--grad1),var(--grad2)) 1}
  .card{transition:box-shadow .18s ease,transform .18s ease}
  .stat{transition:box-shadow .18s ease,transform .18s ease}
  .stat:hover,.rep-kpi:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(30,50,90,.12)}
  .rep-kpi{transition:box-shadow .18s ease,transform .18s ease}
  .src-pill{transition:.18s ease}
  .src-pill:hover{transform:translateY(-1px)}
  .btn-primary{transition:filter .15s,transform .12s,box-shadow .15s;box-shadow:0 4px 14px rgba(47,123,246,.28)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(47,123,246,.35)}
  .btn-primary:active{transform:translateY(0)}
  .chip-filter{transition:.15s ease}
  .chip-filter:hover{border-color:var(--accent);color:var(--accent)}
  .wday,.mcell,.vt-card,.rep-sec{transition:box-shadow .18s ease,transform .18s ease,border-color .15s ease}
  .vt-node{transition:transform .2s ease}
  .vt-row:hover .vt-node{transform:scale(1.06)}
  .funnel-step{transition:transform .15s ease,filter .15s ease}
  .funnel-step:hover{transform:scale(1.02);filter:brightness(1.04)}
  .tab,.month-nav button,.week-nav button,.logout,.cal-toggle button{transition:all .15s ease}

  /* ===================== CLIENTE — DASHBOARD CLARO (cli-ui) ===================== */
  body.cli-ui{background:#eef2f7}
  body.cli-ui #app{--c-bg:#eef2f7;--c-panel:#ffffff;--c-ink:#1c2330;--c-mut:#7c8698;--c-line:#e8edf4;--c-acc:var(--accent,#3b5bdb);--c-accs:#eef1fd;--c-grn:#12a06a;--c-amber:#e8a23b;--c-vio:#7c5cff;--c-blue:#3b82f6}
  body.cli-ui header,body.cli-ui .tabs,body.cli-ui #linkBanner,body.cli-ui .month-nav{display:none!important}
  body.cli-ui main{padding:0;max-width:none;margin:0}
  body.cli-ui #reports.view{display:flex!important;min-height:100vh;background:var(--c-bg);animation:none}
  /* Sidebar */
  body.cli-ui .csb{width:238px;flex-shrink:0;background:var(--c-panel);border-right:1px solid var(--c-line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;box-shadow:2px 0 24px rgba(30,45,80,.04)}
  body.cli-ui .csb-brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
  body.cli-ui .csb-logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--c-acc),#6f8bff);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(59,91,219,.35)}
  body.cli-ui .csb-logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2}
  body.cli-ui .csb-bn{font-weight:800;font-size:16px;color:var(--c-ink);letter-spacing:-.2px}
  body.cli-ui .csb-bs{font-size:11px;color:var(--c-mut)}
  body.cli-ui .csb-cli{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#f6f8fc,#eef2fb);border:1px solid var(--c-line);border-radius:13px;padding:11px;margin-bottom:16px}
  body.cli-ui .csb-av{width:38px;height:38px;border-radius:11px;background:var(--c-acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;overflow:hidden}
  body.cli-ui .csb-av.has-logo{background:#fff;border:1px solid var(--c-line);box-shadow:none}
  body.cli-ui .csb-av img{width:100%;height:100%;object-fit:cover;padding:0;display:block;border-radius:inherit}
  body.cli-ui .csb-cn{font-weight:700;font-size:13.5px;color:var(--c-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.cli-ui .csb-cs{font-size:11px;color:var(--c-mut)}
  body.cli-ui .csb-lab{font-size:10px;letter-spacing:.7px;color:var(--c-mut);text-transform:uppercase;padding:8px 10px 5px;font-weight:800}
  body.cli-ui .csb-nav{display:flex;flex-direction:column;gap:3px;flex:1}
  body.cli-ui .cnav{display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:600;color:#5a6478;border:1px solid transparent;position:relative;transition:all .18s cubic-bezier(.4,0,.2,1)}
  body.cli-ui .cnav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;transition:transform .18s}
  body.cli-ui .cnav:hover{background:#f4f7fb;color:var(--c-ink)}
  body.cli-ui .cnav:hover svg{transform:scale(1.12)}
  body.cli-ui .cnav.on{background:var(--c-accs);color:var(--c-acc);font-weight:800}
  body.cli-ui .cnav.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--c-acc)}
  body.cli-ui .csb-out{margin-top:auto;display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;color:#c0563a;font-weight:700;font-size:13px;cursor:pointer}
  body.cli-ui .csb-out:hover{background:#fdeee9}
  body.cli-ui .csb-out svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9}
  /* Main */
  body.cli-ui .cmain{flex:1;min-width:0;display:flex;flex-direction:column}
  body.cli-ui .ctop{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--c-line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  body.cli-ui .ctit{font-weight:800;font-size:21px;color:var(--c-ink);letter-spacing:-.4px}
  body.cli-ui .csub{font-size:12px;color:var(--c-mut);margin-top:2px}
  body.cli-ui #repRange{background:#f5f8fc;border:1px solid var(--c-line);color:var(--c-ink);border-radius:11px;padding:9px 14px;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(30,45,80,.04)}
  body.cli-ui .cbody{padding:24px 26px 40px;animation:cfade .4s ease}
  @keyframes cfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* KPIs */
  body.cli-ui .rep-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 8px}
  @media(min-width:761px) and (max-width:1180px){body.cli-ui .rep-kpis{grid-template-columns:repeat(3,1fr)}}
  body.cli-ui .rep-kpi{background:var(--c-panel);border:1px solid var(--c-line);border-radius:14px;padding:13px 14px;position:relative;overflow:hidden;transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s;animation:cpop .45s backwards}
  body.cli-ui .rep-kpi:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(30,45,80,.09)}
  body.cli-ui .rep-kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--c-acc),#6f8bff);opacity:.85}
  body.cli-ui .rep-kpi .l{font-size:10.5px;letter-spacing:.4px;color:var(--c-mut);text-transform:uppercase;font-weight:800}
  body.cli-ui .rep-kpi .v{font-size:20px;font-weight:800;color:var(--c-ink);margin-top:6px;letter-spacing:-.4px}
  @keyframes cpop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  /* Cards */
  body.cli-ui .card{background:var(--c-panel);border:1px solid var(--c-line);border-radius:18px;padding:20px;box-shadow:0 3px 14px rgba(30,45,80,.04);color:var(--c-ink)}
  body.cli-ui .card h2{color:var(--c-ink);font-size:15px;font-weight:800}
  body.cli-ui .card h2 svg,body.cli-ui .card .ic{stroke:var(--c-acc)}
  body.cli-ui .rep-grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:15px;margin-top:15px}
  body.cli-ui .rep-insight{background:linear-gradient(135deg,#f7f9fd,#eef2fb)}
  body.cli-ui .rep-insight ul{margin:0;padding-left:18px}
  body.cli-ui .rep-insight li{color:#46516a;font-size:13.5px;line-height:1.75;margin-bottom:6px}
  body.cli-ui .rep-insight b{color:var(--c-ink)}
  body.cli-ui .rep-updated{display:none}
  /* Funnel */
  body.cli-ui .funnel-step{border-radius:11px;box-shadow:0 4px 12px rgba(30,45,80,.10);animation:cgrow .5s backwards cubic-bezier(.34,1.4,.64,1)}
  @keyframes cgrow{from{opacity:0;transform:scaleX(.4)}to{opacity:1;transform:none}}
  body.cli-ui .funnel-step .fl{font-size:12px;opacity:.95}
  body.cli-ui .funnel-step .fv{font-size:17px}
  body.cli-ui .vg-mid{grid-template-columns:0.82fr 1.18fr;align-items:stretch}
  body.cli-ui .funnel-compact{gap:5px;padding:2px 0}
  body.cli-ui .funnel-compact .funnel-step{min-height:40px;padding:8px 10px}
  body.cli-ui .funnel-compact .funnel-step .fl{font-size:10px;letter-spacing:.3px}
  body.cli-ui .funnel-compact .funnel-step .fv{font-size:14px}
  @media(max-width:980px){body.cli-ui .vg-mid{grid-template-columns:1fr}}
  /* Geo bars */
  body.cli-ui .geo-row{padding:5px 0}
  body.cli-ui .geo-name{color:#46516a;font-size:12.5px}
  body.cli-ui .geo-bar-wrap{background:#eef2f7}
  body.cli-ui .geo-bar{background:linear-gradient(90deg,var(--c-acc),#6f8bff);box-shadow:0 1px 4px rgba(59,91,219,.3)}
  body.cli-ui .geo-val{color:var(--c-ink);font-weight:700}
  /* Pizza */
  body.cli-ui .metric-sel{background:#f5f8fc;border:1px solid var(--c-line);color:var(--c-ink)}
  body.cli-ui .pie-legend .sem-dados,body.cli-ui .sem-dados{color:var(--c-mut)}
  /* Top posts / criativos */
  body.cli-ui .top-post{border-bottom:1px solid var(--c-line);padding:13px 0;border-radius:0;transition:background .15s;padding-left:8px;padding-right:8px;margin:0 -8px}
  body.cli-ui .top-post:hover{background:#f6f8fc}
  body.cli-ui .top-thumb{border:1px solid var(--c-line);width:60px;height:60px}
  body.cli-ui .top-rank{background:linear-gradient(135deg,var(--c-acc),#6f8bff);box-shadow:0 4px 10px rgba(59,91,219,.3)}
  body.cli-ui .top-title{color:var(--c-ink)}
  body.cli-ui .top-metrics{color:var(--c-mut)}
  body.cli-ui .top-metrics b{color:var(--c-ink)}
  body.cli-ui .top-desc{background:#f5f8fc;border-left:2px solid var(--c-acc);color:#46516a}
  body.cli-ui .top-link{color:var(--c-acc)}
  /* Seguidores */
  body.cli-ui .seg-pill{background:#f5f8fc;border:1px solid var(--c-line);color:var(--c-mut)}
  body.cli-ui .seg-pill.on{background:linear-gradient(135deg,var(--c-acc),#6f8bff);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(59,91,219,.3)}
  body.cli-ui .seg-bar{background:linear-gradient(180deg,#6f8bff,var(--c-acc));border-radius:6px 6px 0 0}
  body.cli-ui .seg-barx{color:var(--c-mut)}
  body.cli-ui .seg-dname{color:#46516a}
  body.cli-ui .seg-dbar-wrap{background:#eef2f7}
  body.cli-ui .seg-dbar{background:linear-gradient(90deg,var(--c-acc),#6f8bff)}
  body.cli-ui .seg-dval{color:var(--c-ink)}
  body.cli-ui .seg-note{background:#f5f8fc;color:#46516a}
  body.cli-ui .rep-empty{color:var(--c-mut)}
  body.cli-ui .csec{margin-top:18px}
  /* ---- Instagram feed section ---- */
  body.cli-ui .ig-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  body.cli-ui .ig-av{width:52px;height:52px;border-radius:50%;padding:2px;background:conic-gradient(from 210deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);flex:none}
  body.cli-ui .ig-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff;display:block;background:#e9eef6}
  body.cli-ui .ig-av .ig-avph{width:100%;height:100%;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#7c5cff,#4f8cff)}
  body.cli-ui .ig-id{min-width:0}
  body.cli-ui .ig-user{font-weight:800;color:var(--c-ink);font-size:16px;display:flex;align-items:center;gap:6px}
  body.cli-ui .ig-bio{color:var(--c-mut);font-size:12.5px;margin-top:2px;max-width:520px}
  body.cli-ui .ig-open{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;font-weight:700;font-size:13px;color:#fff;text-decoration:none;background:linear-gradient(135deg,#d62976,#962fbf);box-shadow:0 6px 16px rgba(150,47,191,.3);transition:transform .15s,box-shadow .15s}
  body.cli-ui .ig-open:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(150,47,191,.4)}
  body.cli-ui .ig-open svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}
  body.cli-ui .ig-feed{margin-top:16px;border-radius:14px;overflow:hidden;background:#f5f8fc;border:1px solid var(--c-line)}
  body.cli-ui .ig-feed iframe{width:100%;min-height:640px;border:0;display:block}
  body.cli-ui .ig-feed .beholdjs-container,body.cli-ui .ig-feed div{max-width:100%}
  body.cli-ui .ig-empty{padding:40px 22px;text-align:center;color:var(--c-mut)}
  body.cli-ui .ig-empty .ig-emico{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#feda75,#d62976,#962fbf)}
  body.cli-ui .ig-empty .ig-emico svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2}
  body.cli-ui .ig-empty b{color:var(--c-ink);display:block;font-size:15px;margin-bottom:5px}
  body.cli-ui .ig-emico.soft{background:linear-gradient(135deg,#7c8cff,#4f8cff)}
  body.cli-ui .soon-badge{display:inline-block;margin-top:14px;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em;color:#4f5bd5;background:#eef1ff;border:1px solid #dfe4ff}
  body.cli-ui .lead-wrap{margin-top:8px;overflow-x:auto;border-radius:12px;border:1px solid var(--c-line)}
  body.cli-ui .lead-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
  body.cli-ui .lead-tbl thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--c-mut);font-weight:800;padding:11px 14px;background:#f5f8fc;border-bottom:1px solid var(--c-line);position:sticky;top:0}
  body.cli-ui .lead-tbl td{padding:11px 14px;border-bottom:1px solid #eef2f7;color:var(--c-ink);white-space:nowrap}
  body.cli-ui .lead-tbl tbody tr:hover{background:#f7fafe}
  body.cli-ui .lead-tbl tbody tr:last-child td{border-bottom:0}
  body.cli-ui .ld-dt{color:var(--c-mut);font-variant-numeric:tabular-nums}
  body.cli-ui .ld-nome{font-weight:700}
  body.cli-ui .ld-em{color:var(--c-mut);max-width:220px;overflow:hidden;text-overflow:ellipsis}
  body.cli-ui .ld-wa{display:inline-flex;align-items:center;gap:5px;color:#1a7f37;font-weight:700;text-decoration:none}
  body.cli-ui .ld-wa::before{content:"";width:8px;height:8px;border-radius:50%;background:#25d366;display:inline-block}
  body.cli-ui .ld-wa:hover{text-decoration:underline}
  body.cli-ui .ld-tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#4f5bd5;background:#eef1ff;text-transform:capitalize}
  body.cli-ui .ld-st{appearance:none;-webkit-appearance:none;border:1px solid transparent;border-radius:999px;padding:4px 26px 4px 12px;font-size:11.5px;font-weight:800;cursor:pointer;outline:none;transition:box-shadow .15s,filter .15s;background-repeat:no-repeat;background-position:right 8px center;background-size:11px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>")}
  body.cli-ui .ld-st:hover{filter:brightness(.97)}
  body.cli-ui .ld-st.ok{box-shadow:0 0 0 3px rgba(37,211,102,.35)}
  body.cli-ui .ld-st.err{box-shadow:0 0 0 3px rgba(220,50,50,.35)}
  body.cli-ui .ld-st[data-v="Novo"]{color:#c2410c;background-color:#ffedd5;border-color:#fed7aa}
  body.cli-ui .ld-st[data-v="Conversa"]{color:#1d4ed8;background-color:#e7eeff;border-color:#d3ddff}
  body.cli-ui .ld-st[data-v="Fechado"]{color:#1a7f37;background-color:#e3f7ea;border-color:#c3edd0}
  body.cli-ui .ld-st[data-v="Pendente"]{color:#8a1c1c;background-color:#fde8e8;border-color:#f7cccc}
  body.cli-ui .lead-empty{text-align:center;color:var(--c-mut);padding:30px!important;white-space:normal!important}
  body.cli-ui .lead-cards{display:none}
  body.cli-ui .lead-card{border:1px solid var(--c-line);border-radius:13px;padding:12px 13px;margin-top:10px;background:#fff;box-shadow:0 1px 4px rgba(30,45,80,.04)}
  body.cli-ui .lc-r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  body.cli-ui .lc-dt{color:var(--c-mut);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
  body.cli-ui .lc-nome{font-weight:800;font-size:14.5px;color:var(--c-ink);min-width:0}
  body.cli-ui .lc-city{margin-left:auto;color:var(--c-mut);font-size:12px;flex:none}
  body.cli-ui .lc-r2{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  body.cli-ui .lc-wa{flex:none}
  body.cli-ui .lc-em{color:var(--c-mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 140px;min-width:0}
  @media(max-width:760px){body.cli-ui .lead-wrap{display:none}body.cli-ui .lead-cards{display:block}}
  /* Configurações */
  body.cli-ui .cfg-card{max-width:660px}
  body.cli-ui .cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  body.cli-ui .cfg-f{display:flex;flex-direction:column;min-width:0}
  body.cli-ui .cfg-f.full{grid-column:1/-1}
  body.cli-ui .cfg-f label{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--c-mut);font-weight:800;margin-bottom:7px}
  body.cli-ui .cfg-f input{background:#f5f8fc;border:1px solid var(--c-line);border-radius:11px;padding:12px 13px;font-size:14px;color:var(--c-ink);font-family:inherit;transition:border-color .15s,box-shadow .15s}
  body.cli-ui .cfg-f input:focus{outline:none;border-color:var(--c-acc);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
  body.cli-ui .cfg-save{margin-top:18px;background:var(--c-acc);color:#fff;border:none;border-radius:11px;padding:12px 24px;font-weight:800;font-size:14px;cursor:pointer;transition:filter .15s,transform .12s}
  body.cli-ui .cfg-save:hover{filter:brightness(1.06);transform:translateY(-1px)}
  body.cli-ui .cfg-save:disabled{opacity:.6;transform:none}
  body.cli-ui .cfg-sep{height:1px;background:var(--c-line);margin:26px 0 4px}
  body.cli-ui .cfg-msg{display:none;margin-top:13px;font-size:13px;font-weight:700}
  body.cli-ui .cfg-msg.ok{color:#1a7f37}
  body.cli-ui .cfg-msg.err{color:#c0322f}
  @media(max-width:760px){body.cli-ui .cfg-grid{grid-template-columns:1fr}}
  body.cli-ui .g-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  body.cli-ui .g-badge{width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid var(--c-line);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(20,30,60,.06);flex:none}
  body.cli-ui .g-badge svg{width:30px;height:30px}
  body.cli-ui .g-id{min-width:0}
  body.cli-ui .g-name{font-weight:800;color:var(--c-ink);font-size:16px}
  body.cli-ui .g-num{color:var(--c-mut);font-size:12.5px;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  body.cli-ui .g-live{margin-left:auto;font-size:12px;font-weight:700;color:#8a94a6;background:#f1f4f9;border:1px solid var(--c-line);padding:6px 12px;border-radius:999px}
  body.cli-ui .g-live.on{color:#1a7f37;background:#e8f7ee;border-color:#c7ecd3}
  body.cli-ui .ig-grid{margin-top:14px;display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  @media(min-width:761px) and (max-width:1180px){body.cli-ui .ig-grid{grid-template-columns:repeat(4,1fr)}}
  body.cli-ui .ig-cell{position:relative;display:block;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#e9eef6;box-shadow:0 2px 8px rgba(20,30,60,.06);transition:transform .18s,box-shadow .18s}
  body.cli-ui .ig-cell:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 12px 26px rgba(20,30,60,.16);z-index:2}
  body.cli-ui .ig-cell img{width:100%;height:100%;object-fit:cover;display:block}
  body.cli-ui .ig-cell::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 60%,rgba(0,0,0,.22));opacity:0;transition:opacity .18s}
  body.cli-ui .ig-cell:hover::after{opacity:1}
  body.cli-ui .ig-badge{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:7px;background:rgba(0,0,0,.42);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center}
  body.cli-ui .ig-badge svg{width:13px;height:13px;fill:#fff;stroke:#fff}
  @media(max-width:760px){body.cli-ui .ig-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:760px){body.cli-ui .csb{position:fixed;left:-260px;transition:left .25s;z-index:40}body.cli-ui .csb.open{left:0}body.cli-ui .rep-kpis{grid-template-columns:repeat(2,1fr)}body.cli-ui .rep-grid2{grid-template-columns:1fr}body.cli-ui .cmenu{display:flex!important}}
  body.cli-ui .cmenu{display:none;width:40px;height:40px;border-radius:11px;border:1px solid var(--c-line);background:#fff;align-items:center;justify-content:center;cursor:pointer;flex:none}
  body.cli-ui .cmenu svg{width:22px;height:22px;stroke:var(--c-ink);stroke-width:2;fill:none}
  body.cli-ui .ctop-l{display:flex;align-items:center;gap:12px;min-width:0}
  body.cli-ui .csb-ovl{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:35;opacity:0;visibility:hidden;transition:opacity .25s}
  body.cli-ui .csb-ovl.show{opacity:1;visibility:visible}
  @media(max-width:760px){
    body.cli-ui .ctop{padding:11px 15px;gap:10px}
    body.cli-ui .ctit{font-size:18px}
    body.cli-ui .cbody{padding:18px 15px 40px}
    body.cli-ui #repRange{padding:8px 11px;font-size:12.5px}
    body.cli-ui .csb.open{box-shadow:2px 0 34px rgba(0,0,0,.2)}
    body.cli-ui .card{padding:16px;border-radius:15px}
    body.cli-ui .rep-kpi .v{font-size:18px}
  }

  .brand-logo-img{width:100%;height:100%;object-fit:contain;padding:16%;box-sizing:border-box;display:block}
  body.cli-ui .csb-logo img.brand-logo-img{padding:14%}

  .gsub{font-size:11px;font-weight:500;opacity:.55;margin-left:8px}
  .acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .act{display:flex;flex-direction:column;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px}
  .act-ic{display:block;margin-bottom:8px;opacity:.5}
  .act-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .act-v{font-size:24px;font-weight:700;line-height:1.15}
  .act-l{font-size:12px;opacity:.65;margin-top:2px}
  .rep-kpi.alerta .v{color:#e0567a}
  .miss{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .miss-t{font-size:12px;font-weight:600;opacity:.6;margin-bottom:8px}
  .miss-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;background:rgba(224,86,122,.09);margin-bottom:6px;font-size:13px}
  .miss-i b{min-width:52px}
  .miss-i span{opacity:.75}
  .miss-i em{margin-left:auto;font-style:normal;font-size:11px;opacity:.6}
  .gbwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
  .gbars-t{font-size:12px;font-weight:600;opacity:.6;margin-bottom:10px}
  .gbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
  .gb-l{width:36px;opacity:.7;flex:none}
  .gb-t{flex:1;height:8px;border-radius:6px;background:rgba(128,128,128,.16);overflow:hidden}
  .gb-t i{display:block;height:100%;border-radius:6px;background:#2f7bf6}
  .gb-v{width:26px;text-align:right;font-weight:600;flex:none}
.gtbl-w{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gtbl{width:100%;border-collapse:collapse;font-size:14px;min-width:320px}
.gtbl th{text-align:left;font-weight:600;color:var(--muted,#8a8f98);font-size:12px;text-transform:uppercase;letter-spacing:.02em;padding:8px 12px;border-bottom:1px solid rgba(140,140,150,.18)}
.gtbl td{padding:9px 12px;border-bottom:1px solid rgba(140,140,150,.10)}
.gtbl th:nth-child(n+2),.gtbl td:nth-child(n+2){text-align:right;white-space:nowrap}
.gtbl tbody tr:last-child td{border-bottom:none}
.gtbl tbody tr:hover{background:rgba(140,140,150,.06)}
</style>

  const q=new URLSearchParams(location.search).get('c');if(q)return q;

async function entrarComSenha(slug,nome,senha){
  if(!senha){ const e=document.getElementById('pwErr'); if(e)e.textContent='Digite a senha.'; return; }
  const btn=document.getElementById('pwBtn'); if(btn){btn.disabled=true;btn.textContent='Entrando...';}
  try{
    const r=await fetch(SUPA_URL+'/functions/v1/portal-enter',{method:'POST',
      headers:{'Content-Type':'application/json',apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY},
      body:JSON.stringify({slug:slug,senha:senha})});
    const j=await r.json();
    if(j.error||!j.access_token){ telaSenha(slug,nome,j.error||'Não consegui entrar.'); return; }
    const {data,error}=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
    if(error||!data.session){ telaSenha(slug,nome,'A sessão não abriu neste navegador. Tente no Chrome ou Safari.'); return; }
    try{localStorage.setItem('wiz_slug',slug);}catch(_e){}
    hideEntering();
    await afterLogin(data.session);
  }catch(e){
    telaSenha(slug,nome,'Sem conexão com o servidor. Confira a internet.');
  }
}
async function linkLogin(slug){
  showEntering('Abrindo seu portal...');
  try{
    const r=await fetch(SUPA_URL+'/functions/v1/portal-enter',{method:'POST',
      headers:{'Content-Type':'application/json',apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY},
      body:JSON.stringify({slug:slug})});
    const j=await r.json();
    if(j.error){ enteringError(j.error); return; }
    if(j.configurado===false){
      enteringError('Este portal ainda não tem acesso configurado. Chame a Wiz Mídia.'); return;
    }
    telaSenha(slug,j.name,'');
  }catch(e){
    enteringError('Sem conexão com o servidor. Confira a internet e tente de novo.');
  }
}
async function boot(){
  const slug=linkSlug();
  if(slug){
    showEntering();
    let ses=null;
    try{
      let salvo=null; try{salvo=localStorage.getItem('wiz_slug');}catch(_e){}
      if(salvo===slug) ses=(await sb.auth.getSession()).data.session;
    }catch(_e){}
    if(ses){ await afterLogin(ses); return; }
    await linkLogin(slug);return;
  }
  const login=document.getElementById('login');
  // Se já existe sessão salva, esconde o login imediatamente (evita o "flash" da tela de login)
  let hasTok=false;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('sb-')===0&&k.indexOf('-auth-token')>0&&localStorage.getItem(k)){hasTok=true;break;}}}catch(_e){}
  if(hasTok&&login)login.style.display='none';
  const {data:{session}}=await sb.auth.getSession();
  if(session){await afterLogin(session);}
  else if(login){login.style.display='flex';}
}
async function afterLogin(session){
  hideEntering();
  const {data:cli}=await sb.from('portal_clients').select('*').eq('auth_uid',session.user.id).maybeSingle();
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  if(cli){CLIENT=cli;IS_ADMIN=false;ADMIN_CLIENT=false;READONLY=true;setupClientView(false);}
  else{
    const {data:adm}=await sb.from('portal_admins').select('auth_uid').eq('auth_uid',session.user.id).maybeSingle();
    if(!adm){await sb.auth.signOut();document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';showLoginError('Acesso não reconhecido. Use /admin.');return;}
    const {data:cls}=await sb.from('portal_clients').select('*').order('name');CLIENTS=cls||[];
    const ac=new URLSearchParams(location.search).get('ac');
    const c=ac?CLIENTS.find(x=>x.id===ac):null;
    if(c){CLIENT=c;IS_ADMIN=true;ADMIN_CLIENT=true;READONLY=false;setupClientView(true);}
    else{IS_ADMIN=true;ADMIN_CLIENT=false;READONLY=false;setupCentral();}
  }
  await loadData();refreshAll();
}

function laStyle(){ if(document.getElementById('laCss'))return; const st=document.createElement('style'); st.id='laCss'; st.textContent=LA_CSS; document.head.appendChild(st); }
function laEntrega(a){
  const imp=Number(a.impressoes_7d)||0, g=Number(a.gasto_7d)||0;
  if(!imp && !g) return '<span class="la-parado">sem entrega nos últimos 7 dias</span>';
  const n=imp.toLocaleString('pt-BR');
  const v=g>0?(' · R$ '+g.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})):'';
  return '7 dias: '+n+(imp===1?' visualização':' visualizações')+v;
}
function laDesde(iso){
  if(!iso)return '';
  const dias=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/86400000));
  if(dias===0)return 'no ar desde hoje';
  if(dias===1)return 'no ar há 1 dia';
  if(dias<30)return 'no ar há '+dias+' dias';
  const m=Math.floor(dias/30);
  return 'no ar há '+m+(m===1?' mês':' meses');
}

function wireKanban(root){
  root.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragId=card.dataset.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>{dragId=null;card.classList.remove('dragging');root.querySelectorAll('.drop-hi').forEach(x=>x.classList.remove('drop-hi'));});
  });
  root.querySelectorAll('.kcol,.kdrop').forEach(zone=>{
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drop-hi');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('drop-hi'));
    zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drop-hi');const id=dragId;if(!id)return;
      if(zone.dataset.drop==='excluir'){if(confirm('Excluir este conteúdo?')){deleteContent(id).then(()=>{state.contents=state.contents.filter(x=>x.id!==id);renderCalendar();renderStats();toast('Excluído');});}}
      else if(zone.dataset.drop==='arquivar'){updateContent(id,{archived:true});}
      else if(zone.dataset.status==='Aprovado'){openPublish(id);}
      else if(zone.dataset.status){const c=state.contents.find(x=>x.id===id);if(c&&c.status!==zone.dataset.status)updateContent(id,{status:zone.dataset.status});}
    });
  });
  root.querySelectorAll('[data-exp]').forEach(b=>b.onclick=e=>{e.stopPropagation();b.closest('.kcard').classList.toggle('open');});
  root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();openEdit(b.dataset.edit);});
  root.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();openEdit(null,b.dataset.add);});
}
function renderMonthView(){

  const startPad=new Date(y,mo,1).getDay();const daysIn=new Date(y,mo+1,0).getDate();const todayStr=iso(new Date());
  const box=document.getElementById('calBody');box.className='';box.innerHTML='';
  const wrap=document.createElement('div');wrap.className='month-grid';
  DOW.forEach(d=>{const h=document.createElement('div');h.className='month-dow';h.textContent=d;wrap.appendChild(h);});
  const totalCells=Math.ceil((startPad+daysIn)/7)*7;
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startPad+1;const cell=document.createElement('div');
    if(dayNum<1||dayNum>daysIn){cell.className='mcell out';wrap.appendChild(cell);continue;}
    const ds=iso(new Date(y,mo,dayNum));cell.className='mcell'+(ds===todayStr?' today2':'');if(!READONLY)cell.dataset.add=ds;
    const items=dayItems(ds);let chips='';
    items.slice(0,3).forEach(c=>{const t=typeOf(c.type),pub=c.status==='Publicado'?' pub':'';chips+='<div class="mchip'+pub+'" style="background:'+t.hex+'" data-id="'+c.id+'">'+esc(c.tema||'(sem tema)')+'</div>';});
    if(items.length>3)chips+='<div class="mmore">+'+(items.length-3)+' mais</div>';
    cell.innerHTML='<div class="mnum">'+dayNum+'</div>'+chips;wrap.appendChild(cell);
  }
  box.appendChild(wrap);bindCal(box);
}

  else{const central=IS_ADMIN&&!ADMIN_CLIENT;const cid=central?(filterClient!=='all'?filterClient:(CLIENTS[0]&&CLIENTS[0].id)):(CLIENT&&CLIENT.id);form={client_id:cid,tema:central?clientNameOf(cid):'',date:dateStr||iso(new Date()),type:'Feed',status:'Ideia',conteudo:'',legenda:'',roteiro:'',direcao:'',referencia:'',slides:[{conteudo:''}],slideIdx:0,archived:false};document.getElementById('editTitle').textContent='Novo conteúdo';document.getElementById('fDelete').style.display='none';}

function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res((''+r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});}
async function aiGenerate(){
  const aib=document.getElementById('aiCaption');
  let media=[];
  if(pubType==='reels'){
    if(pubCover)media=[pubCover];
    else{
      const vid=pubFiles.find(f=>f.type&&f.type.startsWith('video'));
      if(vid){if(vid.size>12*1024*1024){alert('Vídeo grande demais pra IA ler direto. Suba uma CAPA (imagem) que eu gero a legenda a partir dela.');return;}media=[vid];}
    }
    if(!media.length){alert('Suba a capa (ou o vídeo) primeiro.');return;}
  }else{
    media=pubFiles.filter(f=>f.type&&f.type.startsWith('image'));
    if(!media.length){alert('Selecione a imagem primeiro.');return;}
  }
  aib.disabled=true;const old=aib.textContent;aib.textContent='Gerando…';
  try{
    const images=[];for(const f of media.slice(0,6))images.push({mime:f.type,data:await fileToB64(f)});
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(SUPA_URL+'/functions/v1/ai-caption',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPA_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({images,tema:pubContent&&pubContent.tema})});
    const j=await r.json().catch(()=>({error:'resposta inválida'}));
    if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));
    const t=document.getElementById('pubCaption');if(t)t.value=j.caption;
  }catch(e){alert('IA: '+e.message);}
  aib.disabled=false;aib.textContent=old;
}
async function uploadToStorage(file,idx,clientId){
  const ext=(file.name.split('.').pop()||'bin').toLowerCase();
  const path=(clientId||(CLIENT&&CLIENT.id))+'/'+Date.now()+'_'+idx+'.'+ext;
  const {error}=await sb.storage.from('posts').upload(path,file,{upsert:true,contentType:file.type||'application/octet-stream'});
  if(error)throw new Error('upload: '+error.message);
  return sb.storage.from('posts').getPublicUrl(path).data.publicUrl;
}
document.getElementById('pubGo').onclick=()=>{
  if(!pubFiles.length){alert('Selecione o arquivo.');return;}
  if(pubType==='reels'&&!pubCover){if(!confirm('Sem capa selecionada. Publicar mesmo assim?'))return;}
  if(pubStory==='upload'&&!pubStoryFile){alert('Selecione o arquivo do story.');return;}
  const content=pubContent, files=[...pubFiles], cover=pubCover, type=pubType, caption=document.getElementById('pubCaption').value, story=pubStory, storyFile=pubStoryFile;
  closePub();
  publishInBackground(content,files,cover,type,caption,story,storyFile);
};
async function publishInBackground(content,files,cover,type,caption,story,storyFile){
  publishing.add(content.id);renderCalendar();
  const cid=content.client_id||(CLIENT&&CLIENT.id);
  try{
    const urls=[];for(let i=0;i<files.length;i++)urls.push(await uploadToStorage(files[i],i,cid));
    let cover_url='';if(cover)cover_url=await uploadToStorage(cover,'cover',cid);
    let story_media='';if(story==='upload'&&storyFile)story_media=await uploadToStorage(storyFile,'story',cid);
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(SUPA_URL+'/functions/v1/publish-instagram',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPA_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({client_id:cid,content_id:content.id,type,caption,media:urls,cover_url,story:story||'none',story_media})});
    const j=await r.json().catch(()=>({error:'resposta inválida'}));
    if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));
    publishing.delete(content.id);
    await updateContent(content.id,{status:'Publicado'});
    if(j.story&&j.story.error)toast('Post publicado ✅ mas o story falhou: '+j.story.error);
    else if(j.story&&j.story.ok)toast('Post + Story publicados! 🎉');
    else toast('Publicado no Instagram! 🎉');
  }catch(e){publishing.delete(content.id);renderCalendar();toast('Falha ao publicar: '+e.message);}
}

function weeksOfMonth(){
  const y=cur.getFullYear(),mo=cur.getMonth(),days=new Date(y,mo+1,0).getDate();
  return [[1,7],[8,14],[15,21],[22,days]].map((r,i)=>({n:i+1,from:r[0],to:r[1],items:state.contents.filter(c=>{if(!(c.date||'').startsWith(monthKey()))return false;const dn=+c.date.split('-')[2];return dn>=r[0]&&dn<=r[1];}).sort((a,b)=>a.date.localeCompare(b.date))}));
}
let tlChart=null,TL_metric='Alcance';
function tlDcmp(a,b){const pa=(a||'').split('/'),pb=(b||'').split('/');return (( +pb[1]||0)===(+pa[1]||0))?((+pa[0]||0)-(+pb[0]||0)):((+pa[1]||0)-(+pb[1]||0));}
async function ensureRaw(){if(REP_RAW)return;try{const {data}=await sb.from('portal_reports').select('csv').eq('client_id',CLIENT.id).maybeSingle();const txt=(data&&data.csv||'').trim();if(txt)REP_RAW=parseCSV(txt);}catch(e){}}
function collectSeries(rows){const out={};(rows||[]).forEach(r=>{if((r[1]||'').trim().toUpperCase()!=='SERIE')return;const m=normMetric(r[2]);if(!m)return;const x=(r[4]||'').trim();const v=repNum(r[5]);out[m]=out[m]||{};out[m][x]=(out[m][x]||0)+v;});const res={};Object.keys(out).forEach(m=>{res[m]=Object.keys(out[m]).map(x=>({x,v:out[m][x]})).sort((a,b)=>tlDcmp(a.x,b.x));});return res;}
function drawTL(series){const el=document.getElementById('tlCanvas');if(!el||!window.Chart)return;const s=series[TL_metric]||[];if(tlChart){tlChart.destroy();tlChart=null;}let cum=0;const data=s.map(p=>({x:p.x,y:(cum+=p.v)}));tlChart=new Chart(el,{type:'line',data:{labels:data.map(d=>d.x),datasets:[{label:TL_metric,data:data.map(d=>d.y),borderColor:'#2f7bf6',backgroundColor:'rgba(47,123,246,.18)',fill:true,tension:.3,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#232e42'}},x:{grid:{display:false},ticks:{maxTicksLimit:10}}}}});const tot=document.getElementById('tlTotal');if(tot)tot.textContent='Total de '+TL_metric.toLowerCase()+' no período: '+cum.toLocaleString('pt-BR');}
async function renderTrafficTimeline(){
  document.getElementById('tlTitle').textContent='Evolução do Tráfego';
  const p=document.querySelector('#timeline .vt-head p');if(p)p.textContent='Como suas visualizações, alcance e cliques cresceram ao longo do período';
  const box=document.getElementById('vtimeline');box.innerHTML='<div class="card"><div class="rep-empty">Carregando…</div></div>';
  await ensureRaw();

  const metrics=['Visualizações','Alcance','Cliques'].filter(m=>series[m]&&series[m].length);
  if(!metrics.length){box.innerHTML='<div class="card"><div class="rep-empty">Sem dados de tráfego ainda. Em breve aparecerá aqui.</div></div>';return;}
  if(!metrics.includes(TL_metric))TL_metric=metrics[0];
  box.innerHTML='<div class="card"><div class="pie-head"><h2><svg class="ic" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Acumulado no período</h2><select id="tlMetric" class="metric-sel">'+metrics.map(m=>'<option '+(m===TL_metric?'selected':'')+'>'+m+'</option>').join('')+'</select></div><div class="chartbox" style="height:340px"><canvas id="tlCanvas"></canvas></div><div id="tlTotal" class="rep-updated" style="margin-top:12px;font-size:13px"></div></div>';
  document.getElementById('tlMetric').onchange=e=>{TL_metric=e.target.value;drawTL(series);};

function renderTimeline(){
  if(READONLY)return renderTrafficTimeline();
  const box=document.getElementById('vtimeline');box.innerHTML='';const mo=cur.getMonth();

    const fmt=a=>a.keep?a.raw:(a.money?('R$ '+a.sum.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})):Math.round(a.sum).toLocaleString('pt-BR'));
    const out=order.map(k=>({l:k,v:fmt(acc[k])}));

  })();

  const pm={};others.forEach(s=>Object.keys(D[s].pizza).forEach(dim=>{pm[dim]=pm[dim]||{};Object.keys(D[s].pizza[dim]).forEach(m=>{pm[dim][m]=pm[dim][m]||{};D[s].pizza[dim][m].forEach(sl=>pm[dim][m][sl.l]=(pm[dim][m][sl.l]||0)+sl.v);});}));

  D.TOTAL=T;return D;
}

async function saveConfig(pwMode){
  const msg=document.getElementById(pwMode?'cfgMsg2':'cfgMsg');
  const setMsg=(t,ok)=>{msg.textContent=t;msg.className='cfg-msg '+(ok?'ok':'err');msg.style.display='block';};
  const body={};
  if(pwMode){
    const p=document.getElementById('cfgPass').value,p2=document.getElementById('cfgPass2').value;
    if(!p||p.length<4){setMsg('A senha precisa ter ao menos 4 caracteres.',false);return;}
    if(p!==p2){setMsg('As senhas não conferem.',false);return;}
    body.password=p;
  }else{
    body.name=document.getElementById('cfgName').value.trim();
    body.username=document.getElementById('cfgUser').value.trim();
    body.email=document.getElementById('cfgEmail').value.trim().toLowerCase();
    if(!body.name){setMsg('Informe o nome da empresa.',false);return;}
    if(!/.+@.+\..+/.test(body.email)){setMsg('Email inválido.',false);return;}
  }
  const btn=document.getElementById(pwMode?'cfgPassBtn':'cfgSaveBtn');const ot=btn.textContent;btn.disabled=true;btn.textContent='Salvando…';
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(SUPA_URL+'/functions/v1/client-update',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPA_KEY,Authorization:'Bearer '+(session&&session.access_token||'')},body:JSON.stringify(body)});
    const jr=await r.json().catch(()=>({}));
    if(!r.ok||jr.error)throw new Error(jr.error||('HTTP '+r.status));
    if(pwMode){document.getElementById('cfgPass').value='';document.getElementById('cfgPass2').value='';setMsg('Senha alterada com sucesso.',true);}
    else{
      CLIENT.name=body.name;CLIENT.username=body.username;
      const cn=document.querySelector('.csb-cn');if(cn)cn.textContent=CLIENT.name;
      const ts=document.getElementById('cliSub');if(ts)ts.textContent=CLIENT.name;
      setMsg('Alterações salvas com sucesso.',true);
    }
  }catch(e){setMsg('Não foi possível salvar. '+(e.message||''),false);}
  btn.disabled=false;btn.textContent=ot;
}
async function updateLeadStatus(sel){
  const id=sel.getAttribute('data-id');const v=sel.value;const prev=sel.dataset.v;
  sel.dataset.v=v;sel.disabled=true;
  try{const r=await sb.from('portal_leads').update({status:v}).eq('id',id);if(r.error)throw r.error;sel.classList.add('ok');setTimeout(()=>sel.classList.remove('ok'),800);}
  catch(e){sel.dataset.v=prev;sel.value=prev;sel.classList.add('err');setTimeout(()=>sel.classList.remove('err'),1500);}
  sel.disabled=false;
}

  let cards=(S.kpis||[]).filter(k=>{if(isAdsSale(k.l))return false;const zero=repNum(k.v)===0||['','-','–'].includes((k.v||'').trim());const hideable=/faturamento|pedidos|ticket|retorno|ganhad/i.test(k.l||'');if(/^seguidores\s+instagram$/i.test((k.l||'').trim()))return false;return !(hideable&&zero);}).map(k=>({l:convLbl(adsTag(k.l)),v:fmtKpi(k.v)}));
  const kget=rx=>{const k=(S.kpis||[]).find(k=>new RegExp(rx,'i').test(k.l||''));return k?repNum(k.v):0;};
  const _cl=kget('^Cliques'),_vw=kget('Visualiza'),_vv=kget('Valor em vendas'),_cp=kget('^Compras');
  if(_cl>0&&_vw>0)cards.push({l:'Taxa de cliques',v:(_cl/_vw*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'});
  {const _cv=kget('^Convers'),_iv=kget('Investi');if(_cv>0&&_iv>0)cards.push({l:'Custo por '+convSing(),v:'R$ '+(_iv/_cv).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})});}
  // Sydra: mostra Vendas da loja + Compras/Faturamento (anúncios) JÁ no primeiro render (sem esperar a loja). Vendas da loja usa cache local; o valor ao vivo atualiza no mesmo lugar.
  {const isSy=(typeof CLIENT!=='undefined'&&CLIENT&&(CLIENT.slug==='sydra'||String(CLIENT.id)==='06b0c919-1d58-4a00-add5-17bc738a92a9'));
   if(isSy){const sadd=[];
     const gv=rx=>{const k=(S.kpis||[]).find(k=>new RegExp(rx,'i').test((k.l||'').trim()));return k?k.v:null;};
     const cA=gv('^compras$'); if(cA!=null&&repNum(cA)>0)sadd.push({l:'Compras (anúncios)',v:repNum(cA).toLocaleString('pt-BR')});
     const fA=gv('^faturamento$'); if(fA!=null&&(''+fA).trim())sadd.push({l:'Faturamento (anúncios)',v:(''+fA).toString().trim()});
     cards=sadd.concat(cards);
   }}
  if(cards.length){html+='<div class="rep-kpis" id="repKpis">';cards.forEach((k,i)=>{html+='<div class="rep-kpi '+(k._cls||'')+'"'+(k._id?' id="'+k._id+'"':'')+' style="animation-delay:'+(i*40)+'ms"><div class="l">'+esc(k.l)+'</div><div class="v">'+esc(k.v)+'</div></div>';});html+='</div>';}
  const ins=repInsight(S);
  let mid='<div class="card"><h2><svg class="ic" viewBox="0 0 24 24"><polygon points="3 4 21 4 14 12 14 19 10 21 10 12 3 4"/></svg>Funil de conversão</h2><div class="funnel funnel-compact" id="repFunnel"></div></div>';
  if(ins.length)mid+='<div class="card rep-insight"><h2><svg class="ic" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12c.5.5 1 1.2 1 2h6c0-.8.5-1.5 1-2a7 7 0 0 0-4-12z"/></svg>Resumo do período</h2><ul>'+ins.map(p=>'<li>'+p+'</li>').join('')+'</ul></div>';
  html+='<div class="rep-grid2 vg-mid csec">'+mid+'</div>';
  box.innerHTML=html;renderFunnel(funnelFromKpis(S));injectLojaStats();injectFunnel();
}
function renderGeo(S){
  const el=document.getElementById('repGeo');if(!el)return;
  const data=(S.geo||[]).slice().sort((a,b)=>b.v-a.v).slice(0,8);
  if(!data.length){el.innerHTML='<div class="sem-dados">Sem dados de alcance por região neste período.</div>';return;}
  const max=Math.max.apply(null,data.map(d=>d.v))||1;
  el.innerHTML=data.map(d=>'<div class="geo-row"><span class="geo-name">'+esc(d.l)+'</span><div class="geo-bar-wrap"><div class="geo-bar" style="width:'+Math.max(4,Math.round(d.v/max*100))+'%"></div></div><span class="geo-val">'+d.v.toLocaleString('pt-BR')+'</span></div>').join('');
}
function convLbl(l){var c=(typeof CLIENT!=='undefined'&&CLIENT&&CLIENT.conv_label||'').trim();if(c&&/^convers[õo]es?$/i.test((l||'').trim()))return c;return l;}
function convSing(){var c=(typeof CLIENT!=='undefined'&&CLIENT&&CLIENT.conv_label||'').trim();if(!c)return 'conversão';return c.toLowerCase().replace(/ções$/,'ção').replace(/s$/,'');}
function funnelFromKpis(S){
  if(!S||!S.kpis||!S.kpis.length)return (S&&S.funnel)||[];
  const g=re=>{const it=S.kpis.find(k=>re.test((k.l||'').trim()));return it?repNum(it.v):null;};
  const steps=[];
  const v=g(/^visualiza/i);if(v!=null)steps.push({l:'Visualizações',v:v});
  const a=g(/^alcance/i);if(a!=null)steps.push({l:'Alcance',v:a});
  const c=g(/^cliques( no link)?$/i);if(c!=null)steps.push({l:'Cliques',v:c});
  const compras=g(/^compras$/i),leads=g(/^leads$/i),conv=g(/^convers/i),vis=g(/^visitas ao perfil$/i),inter=g(/^intera/i);
  if(compras!=null)steps.push({l:'Compras (anúncios)',v:compras});
  else if(leads!=null)steps.push({l:'Leads',v:leads});
  else if(conv!=null)steps.push({l:convLbl('Conversões'),v:conv});
  else if(vis!=null)steps.push({l:'Visitas ao perfil',v:vis});
  else if(inter!=null)steps.push({l:'Interações',v:inter});
  return steps.length?steps:((S&&S.funnel)||[]);
}
function renderFunnel(steps){
  const el=document.getElementById('repFunnel');if(!el)return;
  if(!steps||!steps.length){el.innerHTML='<div class="sem-dados">Sem dados de funil.</div>';return;}
  const cols=['#f5a623','#3b82f6','#22c55e','#7c5cff','#e0567a'];const ws=[100,82,64,46,30];
  el.innerHTML=steps.map((s,i)=>'<div class="funnel-step" style="width:'+(ws[i]||28)+'%;background:'+cols[i%cols.length]+'"><div class="fl">'+esc(s.l)+'</div><div class="fv">'+s.v.toLocaleString('pt-BR')+'</div></div>').join('');
}

function renderLegacy(rows,start){
  const box=document.getElementById('repContent');
  const secs={},order=[];
  for(let i=start;i<rows.length;i++){const r=rows[i],sec=(r[0]||'').trim()||'Geral',ind=(r[1]||'').trim(),val=(r[2]!==undefined?r[2]:'').trim();if(!ind&&!val)continue;if(!secs[sec]){secs[sec]=[];order.push(sec);}secs[sec].push({ind,val});}
  let html='<div class="rep-updated">Atualizado '+repUpdated()+' · '+esc(CLIENT.name)+'</div>';
  const dk=order.find(s=>/destaque|kpi/i.test(s));
  if(dk){html+='<div class="rep-kpis">';secs[dk].forEach(it=>{html+='<div class="rep-kpi"><div class="l">'+esc(it.ind)+'</div><div class="v">'+esc(it.val)+'</div></div>';});html+='</div>';}
  const rest=order.filter(s=>s!==dk);
  if(rest.length){const colors=['#2f7bf6','#c13584','#12b886','#f08c00','#7c5cff','#e0567a'];html+='<div class="rep-sections">';rest.forEach((s,idx)=>{const c=colors[idx%colors.length];html+='<div class="card rep-sec"><h3><span class="bul" style="background:'+c+'"></span>'+esc(s)+'</h3>';secs[s].forEach(it=>{html+='<div class="rep-line"><span class="rk">'+esc(it.ind)+'</span><span class="rv">'+esc(it.val)+'</span></div>';});html+='</div>';});html+='</div>';}
  box.innerHTML=html;
}
